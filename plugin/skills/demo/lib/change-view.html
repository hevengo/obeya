<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Code change</title>
<style>
* { box-sizing:border-box; cursor:none; }
body { margin:0; background:#f7f6f2; color:#202b35; font:21px/1.4 system-ui,sans-serif; }
main { padding:24px 28px; }
h1 { margin:0; font-size:32px; line-height:1.18; letter-spacing:-.025em; }
.subtitle { color:#637079; margin:8px 0 16px; font-size:17px; }
.note { margin:12px 0 0; padding:10px 14px; background:#e9eef7; border-left:3px solid #2563eb; font-size:18px; line-height:1.35; }
.inventory { font-size:15px; color:#57655e; margin:8px 0 0; }
.diagram { position:relative; }
.lane { position:absolute; background:#eeede7; border:1px solid #d8d8d0; border-radius:8px; height:100%; }
.lane-head { position:absolute; padding:12px; }
.lane-title { font-size:18px; line-height:1.2; font-weight:750; color:#4e625b; }
.lane-subtitle { margin-top:4px; font-size:14px; line-height:1.3; color:#586d62; }
.box { position:absolute; padding:10px 12px; border:1.5px solid #a5afb8; border-radius:7px; background:#fff; }
.box.changed { border-color:#7199d5; }
.box-title { font-size:21px; font-weight:700; line-height:1.2; }
.path { font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; margin:6px 0; }
.delta { color:#285ab0; font-size:15px; line-height:1.2; }
.boundary { position:absolute; border-top:1px dashed #928679; }
.boundary-label { position:absolute; font-size:13px; line-height:18px; background:#eeede7; padding:0 5px; color:#695d50; }
svg.routes { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.arrow path { stroke:#8d9ba9; stroke-width:2; fill:none; }
.arrow.cross path { stroke-dasharray:5 4; }
.arrow text { font-size:14px; fill:#526579; paint-order:stroke; stroke:#eeede7; stroke-width:5; stroke-linejoin:round; }
.box.lit { background:#e1ebfe; border-color:#2563eb; box-shadow:0 0 0 2px #2563eb; }
.arrow.lit path { stroke:#2563eb; stroke-width:3; marker-end:url(#blue); }
.arrow.lit text { fill:#174cae; font-weight:700; }
.panels { display:grid; gap:14px; }
.panel { border:1px solid #d8d9d2; border-radius:8px; background:#fff; padding:12px 18px; }
.panel h2 { margin:0 0 7px; font-size:24px; line-height:1.2; }
.panel p { margin:5px 0; font-size:20px; line-height:1.3; }
.panel b { color:#486176; font-size:17px; margin-right:5px; }
.locations { margin-top:8px; color:#586a7d; font:13px/1.4 ui-monospace,monospace; overflow-wrap:anywhere; }
.panel.lit { border-color:#2563eb; box-shadow:inset 0 0 0 1px #2563eb; background:#eff4fe; }
.panels.focused .panel:not(.lit) { opacity:.55; }
.code-stack { display:grid; gap:16px; }
.code { border-radius:8px; background:#17242d; color:#e0e8e9; }
.code-head { display:flex; justify-content:space-between; gap:16px; padding:10px 16px; font:14px/1.4 ui-monospace,monospace; background:#233641; border-radius:8px 8px 0 0; }
.code-head span { overflow-wrap:anywhere; }
.code-body { padding:12px 14px; }
.line { display:flex; font:21px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
.number { color:#a1b3ba; flex:0 0 48px; font-size:15px; padding:5px 12px 0 0; text-align:right; }
.sign { flex:0 0 20px; color:#b1d1c4; }
/* One rule for every excerpt: common indent removed, tabs to two columns, wrap anywhere.
   The number belongs to the source line, however many visual rows its text occupies. */
.source-text { white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; tab-size:2; }
.line.add { background:#203e49; color:#d6edf9; }
.line.remove { background:#4a3036; color:#f1dadd; }
.line.lit { outline:2px solid #80acff; background:#214d72; color:#fff; }
.code.lit { box-shadow:0 0 0 2px #80acff; }
.code-label { padding:8px 16px; font-size:17px; color:#bad5f5; background:#243e51; border-radius:0 0 8px 8px; }
.error { border:2px solid #b45532; padding:20px; background:#fff2e8; white-space:pre-wrap; }
</style>
<main><h1 id="title">Code change</h1><div class="subtitle" id="subtitle"></div><div id="content"></div><div id="inventory" class="inventory"></div><div id="note"></div></main>
<script type="module" src="/change-view.js"></script>
</html>
